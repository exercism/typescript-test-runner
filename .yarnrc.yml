compressionLevel: mixed

# We need this for when this .yarnrc.yml file is used inside the docker
# container as the output directory (where the tests are ran) is writable, but
# the global cache folder is not.
enableGlobalCache: false

# Install the packages into node_modules, in CI and in the Docker image. Each
# run links the solution's folder to node_modules. The module hook in
# src/setup.mts doesn't work with Plug'n'Play.
nodeLinker: node-modules
